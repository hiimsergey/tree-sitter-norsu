[package]
name = "tree-sitter-norsu"
description = "A modern markup language designed for personal knowledge management"
version = "0.0.0+1"
authors = ["Sergey Lavrent <sergeylavrent@protonmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "norsu"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/hiimsergey/tree-sitter-norsu"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.3"
